services:
  storage-engine:
    build: .
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
