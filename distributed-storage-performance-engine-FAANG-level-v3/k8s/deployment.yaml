apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-storage-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distributed-storage-engine
  template:
    metadata:
      labels:
        app: distributed-storage-engine
    spec:
      containers:
        - name: storage-engine
          image: distributed-storage-performance-engine:latest
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
